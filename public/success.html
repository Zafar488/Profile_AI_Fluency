<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#070b14" />
    <meta name="robots" content="noindex" />
    <title>Message received | Zafar Ullah</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&amp;family=Manrope:wght@600;700;800&amp;display=swap" rel="stylesheet" />
    <style>
      :root{color-scheme:dark;--bg:#070b14;--surface:#0d1523;--text:#f5f8fa;--muted:#9ba9b7;--line:rgba(255,255,255,.1);--accent:#34d399}*{box-sizing:border-box}body{min-height:100svh;margin:0;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 80% 10%,rgba(34,211,238,.08),transparent 32%),radial-gradient(circle at 10% 90%,rgba(52,211,153,.08),transparent 28%),var(--bg);color:var(--text);font-family:'DM Sans',sans-serif}.success-card{width:min(680px,100%);padding:clamp(38px,8vw,72px);border:1px solid rgba(52,211,153,.24);border-radius:28px;background:linear-gradient(135deg,rgba(17,59,54,.92),rgba(13,33,48,.94) 65%,rgba(16,24,42,.96));box-shadow:0 32px 90px rgba(0,0,0,.36);text-align:center}.success-mark{display:grid;place-items:center;width:58px;height:58px;margin:0 auto 24px;border-radius:50%;background:rgba(52,211,153,.12);border:1px solid rgba(52,211,153,.36);color:var(--accent);font-size:28px;font-weight:800}.eyebrow{margin:0 0 12px;color:var(--accent);font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase}h1{margin:0;font:800 clamp(2.35rem,7vw,4.5rem)/1.04 'Manrope',sans-serif;letter-spacing:-.05em}p{max-width:480px;margin:20px auto 30px;color:#c0cecf;font-size:17px;line-height:1.7}.back-link{display:inline-flex;align-items:center;justify-content:center;border-radius:11px;background:var(--text);color:var(--bg);padding:13px 20px;font-weight:700;text-decoration:none}.back-link:focus-visible{outline:3px solid var(--accent);outline-offset:4px}
    </style>
  </head>
  <body>
    <main class="success-card">
      <div class="success-mark" aria-hidden="true">✓</div>
      <p class="eyebrow">Message sent successfully</p>
      <h1>Thanks! Your message has been received.</h1>
      <p>Your details were submitted through the portfolio contact form. I’ll get back to you as soon as possible.</p>
      <a class="back-link" href="/#contact">Back to portfolio</a>
    </main>
  </body>
</html>
